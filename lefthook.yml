# Generated by os-aid-review-kit. Commit runs the fast checks on what is staged, in order, stopping
# at the first failure; push checks every ref being pushed. Install with `lefthook install`.
pre-commit:
  piped: true
  commands:
    1_review-record:
      run: python3 .review/bin/review.py check
    2_lint-new-findings:
      glob: "*.{kt,kts,swift,py,js,jsx,ts,tsx,mjs,cjs}"
      run: python3 .review/bin/lintgate.py --staged --mode adopt
    3_secret-scan:
      # records hold generated blob hashes, which TruffleHog's SonarCloud detector reads as tokens
      exclude:
        - ".review/records/*"
      run: trufflehog filesystem --no-update --no-verification --fail --config trufflehog.yml {staged_files}
    4_guardrails:
      glob: "*.{kt,kts,swift,py,js,jsx,ts,tsx,mjs,cjs}"
      exclude:
        - ".review/records/*"
      run: semgrep scan --metrics=off --error --quiet --config .semgrep/ {staged_files}

commit-msg:
  commands:
    review-trailers:
      run: python3 .review/bin/review.py trailers {1}

# A script, not a command: lefthook skips a pre-push command when it finds no files in the push
# measured from HEAD, which is the case when a branch other than the checked-out one is pushed.
pre-push:
  scripts:
    "review-gate.sh":
      runner: sh
      use_stdin: true

# Generated by os-aid-review-kit. Runs on every pull request. The lint and security jobs report only
# what the pull request introduces, so an older repository is not failed for code it inherited.
name: quality-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
# kit:lang=python
      - name: Ruff and mypy
        run: |
          pip install ruff==0.17.3 mypy==2.4.1
          git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- '*.py' > py.txt
          if [ -s py.txt ]; then mypy $(cat py.txt) || echo "::warning::mypy reported type errors (advisory)"; fi
# kit:end
# kit:lang=javascript
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @biomejs/biome@2.6.8
# kit:end
# kit:lang=kotlin
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: ktlint and detekt
        run: |
          curl -sSLf -o /usr/local/bin/ktlint https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x /usr/local/bin/ktlint
          curl -sSLf -o detekt.zip https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8.zip
          unzip -q detekt.zip -d /opt && ln -s /opt/detekt-cli-1.23.8/bin/detekt-cli /usr/local/bin/detekt
# kit:end
      - name: New findings only
        run: python3 .review/bin/lintgate.py --base origin/${{ github.base_ref }} --json lint.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-findings
          path: lint.json
          if-no-files-found: ignore

# kit:lang=swift
  swiftlint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: brew install swiftlint
      - name: New findings only
        run: python3 .review/bin/lintgate.py --base origin/${{ github.base_ref }}
# kit:end

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          pip install semgrep==1.186.0
          curl -sSLf https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz | tar -xz -C /usr/local/bin trivy
          curl -sSLf https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.0/trufflehog_3.100.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin trufflehog
      - name: Semgrep (new findings against the base branch)
        run: semgrep scan --metrics=off --config auto --config .semgrep/ --error --baseline-commit $(git merge-base origin/${{ github.base_ref }} HEAD)
      - name: Trivy (HIGH and CRITICAL in lockfiles)
        run: trivy fs --config trivy.yaml .
      - name: SBOM (CycloneDX)
        if: always()
        run: trivy fs --format cyclonedx --output sbom.cdx.json --exit-code 0 .
      - name: TruffleHog (commits in this pull request)
        run: trufflehog git file://. --since-commit $(git merge-base origin/${{ github.base_ref }} HEAD) --config trufflehog.yml --no-update --fail
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore

  review-records:
    # Every changed file must appear, with its exact content, in a review record. The summary goes
    # into the job summary so a human reviewer sees tier, author, checks and findings in one place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 .review/bin/review.py pr-body --base origin/${{ github.base_ref }} >> "$GITHUB_STEP_SUMMARY"
      - run: python3 .review/bin/review.py check --base origin/${{ github.base_ref }}

  pr-agent:
    # Advisory only. Secrets are not passed to workflows from forks, so on a fork's pull request
    # this job has no key and skips; that is deliberate, since pull_request_target would hand the
    # key to code from the fork.
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Skip without a key
        id: key
        run: echo "present=${{ secrets.ANTHROPIC_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - uses: The-PR-Agent/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430 # v0.49.0
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC__KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONFIG__MODEL: anthropic/claude-sonnet-5-5
          CONFIG__FALLBACK_MODELS: '[]'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "true"

  sonarqube:
    # Optional. Set the repository variable SONAR_ENABLED to true and add SONAR_TOKEN and SONAR_HOST_URL.
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

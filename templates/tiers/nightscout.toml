# cgm-remote-monitor. Nightscout doses nothing, but loops read glucose and treatments from it and
# some upload through it, so whatever decides what is stored or served through the APIs is high.
mode = "adopt"
default_tier = "medium"

[high]
paths = [
  "lib/server/entries.js", "lib/server/treatments.js", "lib/server/profile.js", "lib/server/devicestatus.js",
  "lib/api/*", "lib/api3/*", "lib/authorization/*", "lib/data/*", "lib/server/websocket.js",
  "lib/plugins/bwp.js", "lib/plugins/iob.js", "lib/plugins/cob.js", "lib/plugins/ar2.js", "lib/server/bootevent.js",
  "lib/settings.js", "package.json",
]

[medium]
paths = ["lib/*", "views/*", "static/*", "*.js"]

[low]
paths = ["*.md", "docs/*", "testing/*"]

[exempt]
paths = ["*.png", "*.jpg", "*.svg", "*.ico", "*.pdf", "LICENSE*", "package-lock.json", "translations/*"]

[tests]
# upstream's own CI commands; integration needs a MongoDB at the address in tests/ci.test.env
unit = "npm run --silent test:unit:ci > .review/.test-output.txt 2>&1; s=$?; grep -E 'passing|failing' .review/.test-output.txt | tr '\\n' ' '; exit $s"
integration = "npm run --silent test:integration:ci > .review/.test-integration.txt 2>&1; s=$?; grep -E 'passing|failing' .review/.test-integration.txt | tr '\\n' ' '; exit $s"
